<title>chat</title>

</head>
<body>
<div id="app-shell">
  <header id="app-header"><span>chat</span><span id="connection-status" role="status">connecting…</span></header>
  <nav id="drawer"><ul id="drawer-items"><li class="degraded">drawer unavailable</li></ul></nav>
  <main id="bubbles" aria-live="polite"></main>
  <section id="add-content" hidden></section>
  <form id="composer"><input id="composer-input" type="text" autocomplete="off" placeholder="message"><button type="submit" id="composer-send">send</button></form>
  <div id="frag-host"><iframe id="frag-frame" sandbox="allow-scripts" title="bubble content"></iframe></div>
</div>
<noscript><p>chat needs JavaScript for the transport shim. Static shell only.</p></noscript>
